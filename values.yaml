# -- Override the chart name used in resource names.
# Defaults to "auth-o-tron" to strip the "-chart" suffix from resource names.
nameOverride: "auth-o-tron"
# -- Fully override the computed resource name (bypasses Release.Name and nameOverride)
fullnameOverride: ""

# -- Number of auth-o-tron pod replicas
replicaCount: 1

# -- Metrics server and Prometheus scraping configuration.
# When enabled, a dedicated metrics/health server runs on metrics.port.
metrics:
  enabled: true
  # -- Metrics server port (must match config.metrics.port)
  port: 9090
  serviceMonitor:
    # -- Create a ServiceMonitor resource for Prometheus Operator scraping.
    enabled: true
    interval: 30s
    scrapeTimeout: 10s

# -- Container image settings
# Auth-O-Tron 0.4.0 is pending release from upstream PR #84.
image:
  repository: eccr.ecmwf.int/auth-o-tron/auth-o-tron
  tag: 0.4.0
  pullPolicy: IfNotPresent

# -- Existing Secret that owns the active RSA signing private key.
# The chart references this Secret; it never creates it or copies its PEM into the ConfigMap.
jwt:
  privateKeySecret:
    name: auth-o-tron-jwt
    key: private-key.pem

# -- Credentials for pulling from a private registry.
# Enable and fill in imageCredentials to create an image pull secret.
pullSecret:
  enabled: false
  # imageCredentials:
  #   registry: ""
  #   username: ""
  #   password: ""

# -- Annotations added to each pod (template-level metadata).
# Useful for sidecar injection, log routing, etc.
podAnnotations: {}

# -- Extra environment variables injected into the auth-o-tron container.
# AOT_JWT__PRIVATE_KEY is reserved for jwt.privateKeySecret.
extraEnv: []

# -- Kubernetes Service configuration
service:
  type: ClusterIP
  # -- Client-facing Service port.
  port: 8080
  # -- Container/app listen port (must match config.server.port).
  targetPort: 8080
  # -- Annotations added to the Service resource.
  annotations: {}

# -- Ingress configuration for external access.
# Only the application port is routed via ingress; the metrics port
# is not included in the Ingress rules.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: auth-o-tron.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: auth-o-tron-tls
  #    hosts:
  #      - auth-o-tron.example.com

# -- auth-o-tron application configuration (mounted as config.yaml)
config:
  version: "2.0.0"
  logging:
    level: info
    format: json

  # -- Authentication provider list (see auth-o-tron docs)
  providers: []

  # -- JWT signing settings. iss and kid must be set explicitly.
  # aud defaults to the Polytope server consumer contract.
  # The private key is injected separately from jwt.privateKeySecret.
  jwt:
    exp: 3600
    iss: ""
    aud: polytope-server
    kid: ""

  # -- Server bind settings (port must match service.targetPort)
  server:
    host: "0.0.0.0"
    port: 8080

  # -- Metrics server settings (port must match metrics.port)
  metrics:
    enabled: true
    port: 9090
