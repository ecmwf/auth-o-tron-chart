# -- Override the chart name used in resource names.
# Defaults to "auth-o-tron" to strip the "-chart" suffix from resource names.
nameOverride: "auth-o-tron"
# -- Fully override the computed resource name (bypasses Release.Name and nameOverride)
fullnameOverride: ""

# -- MongoDB subchart toggle (see bitnami/mongodb for full options)
mongodb:
  enabled: false

# -- Browser backend credential reference; never put the password in values/config.
# For bundled Valkey these must match valkey.auth.usersExistingSecret and
# valkey.auth.aclUsers.default.passwordKey. No Secret is generated by this chart.
browserState:
  passwordSecret:
    name: ""
    key: "default"
  # -- Same-namespace Auth-O-Tron pods only (requires a NetworkPolicy-capable CNI).
  networkPolicy:
    enabled: true

# -- Official valkey-io/valkey chart. Enabling it does NOT enable login/UI.
valkey:
  enabled: false
  replica:
    enabled: false
  service:
    type: ClusterIP
    port: 6379
  deploymentStrategy: Recreate
  dataStorage:
    enabled: false
  auth:
    enabled: true
    usersExistingSecret: ""
    aclUsers:
      default:
        permissions: "~* &* +@all"
        passwordKey: default
  valkeyConfig: |
    save ""
    appendonly no
    maxmemory 64mb
    maxmemory-policy noeviction
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  initResources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
  # Upstream unauthenticated CLI probes cannot verify ACL-authenticated health.
  # TCP probes check listening only; application operations still authenticate.
  startupProbe:
    customProbe:
      tcpSocket:
        port: tcp
      failureThreshold: 30
      periodSeconds: 2
  livenessProbe:
    customProbe:
      tcpSocket:
        port: tcp
  readinessProbe:
    enabled: true
    customProbe:
      tcpSocket:
        port: tcp

# -- Static auth-o-tron replicas; ignored when autoscaling.enabled is true.
replicaCount: 1

# -- Application container resources. CPU HPA requires a positive requests.cpu.
resources: {}

# -- Optional application HPA; does not scale Valkey or install metrics adapters.
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  # -- CPU percentage (1..100); set null for custom-metric-only scaling.
  targetCPUUtilizationPercentage: 70
  # -- Optional Pods AverageValue target (1..256) for
  # authotron_browser_logins_inflight. Requires an external custom metrics adapter.
  # Requires enabled UI/direct login, and must be below max_inflight_logins (default 8).
  targetInFlightLogins: null

# -- Metrics server and Prometheus scraping configuration.
# When enabled, a dedicated metrics/health server runs on metrics.port.
metrics:
  enabled: true
  # -- Metrics server port (must match config.metrics.port)
  port: 9090
  serviceMonitor:
    # -- Create a ServiceMonitor resource for Prometheus Operator scraping.
    enabled: true
    interval: 30s
    scrapeTimeout: 10s

# -- Container image settings
image:
  repository: eccr.ecmwf.int/auth-o-tron/auth-o-tron
  tag: 0.3.6
  pullPolicy: IfNotPresent

# -- Credentials for pulling from a private registry.
# Enable and fill in imageCredentials to create an image pull secret.
pullSecret:
  enabled: false
  # imageCredentials:
  #   registry: ""
  #   username: ""
  #   password: ""

# -- Annotations added to each pod (template-level metadata).
# Useful for sidecar injection, log routing, etc.
podAnnotations: {}

# -- Extra environment variables injected into the auth-o-tron container.
# Use this to pass secrets via secretKeyRef instead of the ConfigMap.
# Example:
#   extraEnv:
#     - name: MY_SECRET
#       valueFrom:
#         secretKeyRef:
#           name: my-secret
#           key: token
extraEnv: []

# -- Kubernetes Service configuration
service:
  type: ClusterIP
  # -- Client-facing Service port.
  port: 8080
  # -- Container/app listen port (must match config.server.port).
  targetPort: 8080
  # -- Annotations added to the Service resource.
  annotations: {}

# -- Ingress configuration for external access.
# Only the application port is routed via ingress; the metrics port
# is not included in the Ingress rules.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: auth-o-tron.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: auth-o-tron-tls
  #    hosts:
  #      - auth-o-tron.example.com

# -- auth-o-tron application configuration (mounted as config.yaml)
config:
  version: "2.0.0"
  logging:
    level: info
    format: json

  # -- ConfigV2 login UI overrides. The application supplies all UI defaults.
  ui: {}

  # -- Authentication provider list (see auth-o-tron docs)
  providers: []

  # -- Optional persistent token store (e.g. MongoDB)
  store:
    enabled: false
    # type: "mongo"
    # database: "tokens"
    # uri: "mongodb://mongodb:27017"

  # -- JWT signing settings
  jwt:
    exp: 3600
    iss: ""
    secret: ""

  # -- Downstream service definitions
  services: []

  # -- Server bind settings (port must match service.targetPort)
  server:
    host: "0.0.0.0"
    port: 8080

  # -- Metrics server settings (port must match metrics.port)
  metrics:
    enabled: true
    port: 9090
