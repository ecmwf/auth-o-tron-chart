nameOverride: ""
fullnameOverride: ""

mongodb:
  enabled: false

replicaCount: 1

image:
  repository: eccr.ecmwf.int/auth-o-tron/auth-o-tron-debug
  tag: 0.2.2
  pullPolicy: IfNotPresent

# pullSecret is used to pull images from a private registry
pullSecret:
  enabled: false
  # if you want to use a private registry, you can provide the credentials here
  # imageCredentials:
  #   registry: ""
  #   username: ""
  #   password: ""

service:
  type: ClusterIP
  port: 8080

config:
  version: 1.0.0 # this is the version of the configuration file
  logging:
    level: info
    format: console
  
  providers: []

  store:
    enabled: false
    # you can enable the store and configure it to use a MongoDB instance
    # type: "mongo"
    # database: "tokens"
    # uri: "mongodb://mongodb:27017"

  jwt:
    exp: 3600
    iss: ""
    aud: ""
    secret: ""
  
  services: []

  bind_address: "0.0.0.0:8080"