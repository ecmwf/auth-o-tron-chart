# -- Override the chart name used in resource names.
# Defaults to "auth-o-tron" to strip the "-chart" suffix from resource names.
nameOverride: "auth-o-tron"
# -- Fully override the computed resource name (bypasses Release.Name and nameOverride)
fullnameOverride: ""

# -- MongoDB subchart toggle (see bitnami/mongodb for full options)
mongodb:
  enabled: false

# -- Number of auth-o-tron pod replicas
replicaCount: 1

# -- Metrics server and Prometheus scraping configuration.
# When enabled, a dedicated metrics/health server runs on metrics.port.
metrics:
  enabled: true
  # -- Metrics server port (must match config.metrics.port)
  port: 9090
  serviceMonitor:
    # -- Create a ServiceMonitor resource for Prometheus Operator scraping.
    enabled: true
    interval: 30s
    scrapeTimeout: 10s

# -- Container image settings
image:
  repository: eccr.ecmwf.int/auth-o-tron/auth-o-tron
  tag: 0.2.12
  pullPolicy: IfNotPresent

# -- Credentials for pulling from a private registry.
# Enable and fill in imageCredentials to create an image pull secret.
pullSecret:
  enabled: false
  # imageCredentials:
  #   registry: ""
  #   username: ""
  #   password: ""

# -- Annotations added to each pod (template-level metadata).
# Useful for sidecar injection, log routing, etc.
podAnnotations: {}

# -- Extra environment variables injected into the auth-o-tron container.
# Use this to pass secrets via secretKeyRef instead of the ConfigMap.
# Example:
#   extraEnv:
#     - name: MY_SECRET
#       valueFrom:
#         secretKeyRef:
#           name: my-secret
#           key: token
extraEnv: []

# -- Kubernetes Service configuration
service:
  type: ClusterIP
  # -- Client-facing Service port.
  port: 8080
  # -- Container/app listen port (must match config.server.port).
  targetPort: 8080
  # -- Annotations added to the Service resource.
  annotations: {}

# -- auth-o-tron application configuration (mounted as config.yaml)
config:
  version: 1.0.0
  logging:
    level: info
    format: json

  # -- Authentication provider list (see auth-o-tron docs)
  providers: []

  # -- Optional persistent token store (e.g. MongoDB)
  store:
    enabled: false
    # type: "mongo"
    # database: "tokens"
    # uri: "mongodb://mongodb:27017"

  # -- JWT signing settings
  jwt:
    exp: 3600
    iss: ""
    secret: ""

  # -- Downstream service definitions
  services: []

  # -- Server bind settings (port must match service.targetPort)
  server:
    host: "0.0.0.0"
    port: 8080

  # -- Metrics server settings (port must match metrics.port)
  metrics:
    enabled: true
    port: 9090
