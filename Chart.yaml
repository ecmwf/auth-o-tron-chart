apiVersion: v2
name: auth-o-tron-chart
description: |
  Auth-O-Tron: Effortless authentication and authorization for web APIs.

  Key Features:
  - Supports multiple authentication providers simultaneously.
  - Integrates with ingress-level auth redirection (e.g., nginx auth_request).
  - Proxies authenticated requests with JWTs for API access control.
  - Role- and attribute-based access control for endpoints.

type: application

version: 0.4.0
appVersion: 0.4.0

maintainers:
  - name: Samet Demir
  - name: Peter Tsrunchev
  - name: James Hawkes

sources:
  - https://github.com/ecmwf/auth-o-tron

keywords:
  - authentication
  - authorization
  - api
  - jwt
  - oauth2

home: https://github.com/ecmwf/auth-o-tron

icon: https://github.com/ecmwf/auth-o-tron/raw/main/authotron/docs/logo-light.png
