name: Helm contracts

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  helm-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        helm: [v3.17.3, v4.0.1]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: azure/setup-helm@v4.3.0
        with:
          version: ${{ matrix.helm }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python -m pip install -r tests/requirements.txt

      - name: Python lint and format
        run: |
          python -m ruff check tests tools
          python -m ruff format --check tests tools

      - name: Render contracts and strict lint profiles
        run: python tests/render_contract.py

  generated-config-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Read application schema pin
        id: schema
        run: >-
          jq -r '.properties.config."x-authotron-source"
          | "repository=\(.repository)", "commit=\(.commit)", "path=\(.path)"'
          values.schema.json >> "$GITHUB_OUTPUT"

      - name: Checkout version-matched application schema
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.schema.outputs.repository }}
          ref: ${{ steps.schema.outputs.commit }}
          path: .application-schema
          sparse-checkout: ${{ steps.schema.outputs.path }}
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Generator self-tests
        run: python tests/test_generate_config_schema.py

      - name: Verify values.schema.json is generated from the pinned application
        run: >-
          python tools/generate_config_schema.py --check
          --schema-path ".application-schema/${{ steps.schema.outputs.path }}"
