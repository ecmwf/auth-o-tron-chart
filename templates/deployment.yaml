apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
      {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
        checksum/config: {{ .Values | toYaml | sha256sum }}
    spec:
    {{- if .Values.pullSecret.enabled }}
      imagePullSecrets:
        - name: {{ include "fullname" . }}-pull-secret
    {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http-auth
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          {{- if .Values.metrics.enabled }}
            - name: http-metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
          {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http-auth
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http-auth
            initialDelaySeconds: 3
            periodSeconds: 5
          {{- $backend := dig "ui" "browser_session" "backend" (dict) .Values.config }}
          {{- $browserPassword := and (eq $backend.type "valkey") .Values.browserState.passwordSecret.name }}
          {{- if or .Values.extraEnv $browserPassword }}
          env:
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if $browserPassword }}
            - name: AOT_UI__BROWSER_SESSION__BACKEND__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.browserState.passwordSecret.name | quote }}
                  key: {{ $.Values.browserState.passwordSecret.key | quote }}
            {{- end }}
          {{- end }}
          volumeMounts:
            - name: config-volume
              mountPath: /app/config.yaml
              subPath: config.yaml
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
      volumes:
        - name: config-volume
          configMap:
            name: {{ include "fullname" . }}-config
            items:
              - key: config.yaml
                path: config.yaml
